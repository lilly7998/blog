{{- $zh := ne .Page.Language.Lang "en" -}}
{{- $dataPage := "data/" | relLangURL -}}
<div id="homedata" class="not-prose" data-lang="{{ if $zh }}zh{{ else }}en{{ end }}" data-base="{{ "/" | relURL }}" style="text-align:left;margin:0 auto 1.5rem;max-width:56rem">
  <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem">
    <div style="font-weight:700;font-size:1.05rem">{{ if $zh }}数据速览{{ else }}Data at a glance{{ end }}</div>
    <a href="{{ $dataPage }}" style="font-size:.8rem;opacity:.8">{{ if $zh }}全部图表{{ else }}All charts{{ end }} →</a>
  </div>
  <a href="{{ $dataPage }}" style="text-decoration:none;color:inherit;display:block">
    <div class="hd-kpis" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.5rem"></div>
    <div class="hd-charts" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.5rem;margin-top:.5rem"></div>
  </a>
  <div class="hd-status" style="font-size:.75rem;opacity:.7;margin-top:.4rem"></div>
</div>
<script src="{{ "js/datakit.js" | relURL }}"></script>
<script>
(function(){
  const root=document.getElementById('homedata');if(!root||!window.DataKit)return;
  const K=DataKit,L=K.T[root.dataset.lang],C=K.C;
  K.load(root.dataset.base).then(([e,u])=>{
    const E=e&&e.series,U=u&&u.series,st=root.querySelector('.hd-status');
    if(!E&&!U){st.textContent=L.fail;return}
    root.querySelector('.hd-kpis').innerHTML=K.kpis(E,U,L);
    if(E){const t=s=>(s||[]).slice(-60);
      root.querySelector('.hd-charts').innerHTML=K.chart(L.c_rates,[{l:L.ecb,data:t(E.dfr),c:C.eu},{l:L.fedl,data:t(E.fed),c:C.us}])+
        K.chart(L.c_infl,[{l:L.ea,data:t(E.hicp),c:C.eu},{l:L.us,data:t(E.us_cpi),c:C.us}],{dec:1});}
    st.textContent=L.asof+' '+K.asof(e||u)+' · '+L.src;
  });
})();
</script>
