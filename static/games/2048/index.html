<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>2048 · wyz.name 小游戏</title>
<style>
:root{
  --bs: max(220px, min(calc(100vw - 28px), calc(100vh - 212px), 500px));
  --u: calc(var(--bs) / 100);
  --cyan:#22d3ee; --indigo:#818cf8; --bg:#0b1020; --panel:#121a33; --text:#e2e8f0; --muted:#8b97b5;
}
@supports (height: 100dvh){
  :root{ --bs: max(220px, min(calc(100vw - 28px), calc(100dvh - 212px), 500px)); }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:radial-gradient(120% 80% at 50% -10%, #17204a 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.app{width:var(--bs);display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{
  font-size:36px;font-weight:900;letter-spacing:-1px;line-height:1;
  background:linear-gradient(90deg,var(--cyan),var(--indigo));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(34,211,238,.25));
}
.scores{display:flex;gap:6px}
.score{
  position:relative;min-width:72px;padding:5px 10px 6px;border-radius:12px;text-align:center;
  background:var(--panel);border:1px solid rgba(129,140,248,.22);
}
.score .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.score .val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.plus{
  position:absolute;left:0;right:0;top:4px;text-align:center;font-weight:800;font-size:15px;
  color:var(--cyan);pointer-events:none;animation:float .7s ease-out forwards;
}
@keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.btns{display:flex;gap:6px;flex-shrink:0}
button{
  font:inherit;font-weight:700;font-size:13px;color:var(--text);cursor:pointer;
  border:1px solid rgba(129,140,248,.3);background:var(--panel);
  padding:8px 12px;border-radius:10px;transition:transform .08s, background .15s, opacity .15s;
}
button:hover{background:#18224a}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;cursor:default;transform:none}
button.primary{
  border:none;color:#06101f;
  background:linear-gradient(90deg,var(--cyan),var(--indigo));
  box-shadow:0 4px 18px rgba(34,211,238,.25);
}
button.primary:hover{filter:brightness(1.08)}
.board{
  position:relative;width:var(--bs);height:var(--bs);border-radius:calc(var(--u) * 3.2);
  background:#0f1730;
  box-shadow:0 0 0 1px rgba(129,140,248,.28), 0 10px 40px rgba(0,0,0,.45), 0 0 50px rgba(34,211,238,.08);
  touch-action:none;overflow:hidden;cursor:grab;
}
.board *{touch-action:none}
.cell,.tile{position:absolute;width:21.875%;height:21.875%;border-radius:calc(var(--u) * 2.2)}
.cell{background:rgba(148,163,184,.07);box-shadow:inset 0 0 0 1px rgba(148,163,184,.05)}
.tile{
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;
  transition:left .11s ease-in-out, top .11s ease-in-out;z-index:2;
}
.tile.ghost{z-index:1}
.tile.new{animation:appear .18s ease .09s backwards}
.tile.merged{z-index:3;animation:pop .2s ease .09s backwards}
@keyframes appear{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes pop{0%{transform:scale(0)}55%{transform:scale(1.16)}100%{transform:scale(1)}}
.d1,.d2{font-size:calc(var(--u) * 10)}
.d3{font-size:calc(var(--u) * 8.4)}
.d4{font-size:calc(var(--u) * 6.6)}
.d5,.d6,.d7{font-size:calc(var(--u) * 5.1)}
.v2{background:#18244a;color:#c7d2e8;box-shadow:inset 0 0 0 1px rgba(148,163,184,.12)}
.v4{background:#1c2f62;color:#dbe7ff;box-shadow:inset 0 0 0 1px rgba(148,163,184,.14)}
.v8{background:#1e3a8a;color:#e0f2fe}
.v16{background:#1d4ed8;color:#fff}
.v32{background:#0369a1;color:#fff}
.v64{background:#0891b2;color:#fff;box-shadow:0 0 14px rgba(8,145,178,.35)}
.v128{background:linear-gradient(135deg,#06b6d4,#22d3ee);color:#03121f;box-shadow:0 0 18px rgba(34,211,238,.4)}
.v256{background:linear-gradient(135deg,#22d3ee,#818cf8);color:#050c1f;box-shadow:0 0 20px rgba(103,190,248,.45)}
.v512{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;box-shadow:0 0 22px rgba(129,140,248,.5)}
.v1024{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;box-shadow:0 0 24px rgba(167,139,250,.55)}
.v2048{background:linear-gradient(135deg,#f59e0b,#fcd34d);color:#1a1203;box-shadow:0 0 28px rgba(251,191,36,.6)}
.vbig{background:linear-gradient(135deg,#f43f5e,#f59e0b);color:#fff;box-shadow:0 0 28px rgba(244,63,94,.55)}
.overlay{
  position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(8,12,28,.78);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  text-align:center;padding:16px;animation:fade .3s ease;
}
.overlay.show{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.overlay h2{
  font-size:calc(var(--u) * 10);font-weight:900;line-height:1.1;
  background:linear-gradient(90deg,var(--cyan),var(--indigo));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.overlay.win h2{background:linear-gradient(90deg,#fcd34d,#f59e0b,#f472b6);-webkit-background-clip:text;background-clip:text}
.overlay p{color:var(--muted);font-size:14px}
.overlay p b{color:var(--text);font-size:18px}
.overlay .btns{margin-top:4px}
.overlay button{touch-action:manipulation}
.help{font-size:12px;color:var(--muted);text-align:center;line-height:1.45}
.help kbd{font-family:inherit;font-size:11px;padding:1px 5px;border-radius:5px;background:var(--panel);border:1px solid rgba(129,140,248,.25);color:var(--text)}
.foot{font-size:11px;text-align:center;color:#5d6889;letter-spacing:.04em}
.foot span{background:linear-gradient(90deg,var(--cyan),var(--indigo));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
@media (max-width:380px){
  .logo{font-size:30px}
  .score{min-width:62px;padding:4px 8px 5px}
  .score .val{font-size:16px}
  button{padding:7px 10px;font-size:12px}
  .sub{display:none}
  .bar{justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){
  .tile{transition:none}.tile.new,.tile.merged{animation:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="logo">2048</div>
    <div class="scores">
      <div class="score" id="scoreBox"><div class="lbl" data-i="score"></div><div class="val" id="score">0</div></div>
      <div class="score"><div class="lbl" data-i="best"></div><div class="val" id="best">0</div></div>
    </div>
  </div>
  <div class="bar">
    <div class="sub" data-i="sub"></div>
    <div class="btns">
      <button id="langBtn" type="button" aria-label="Language"></button>
      <button id="undoBtn" type="button" data-i="undo"></button>
      <button id="newBtn" type="button" class="primary" data-i="newGame"></button>
    </div>
  </div>
  <div class="board" id="board" aria-label="2048">
    <div id="cells"></div>
    <div id="tiles"></div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle"></h2>
      <p id="ovMsg"></p>
      <div class="btns" id="ovBtns"></div>
    </div>
  </div>
  <div class="help" id="help"></div>
  <div class="foot"><span data-i="footer"></span></div>
</div>
<script>
(function () {
  'use strict';
  var SIZE = 4;

  /* ---------- pure logic (also exported for node tests) ---------- */
  // items: non-empty tiles ordered from the wall the move goes toward.
  // Each tile merges at most once per move.
  function mergeLine(items, val) {
    var out = [], i = 0;
    while (i < items.length) {
      var a = items[i], b = items[i + 1];
      if (i + 1 < items.length && val(a) === val(b)) {
        out.push({ item: a, other: b, value: val(a) * 2 });
        i += 2;
      } else {
        out.push({ item: a, other: null, value: val(a) });
        i += 1;
      }
    }
    return out;
  }
  function slideLine(line) {
    var items = line.filter(function (v) { return v; });
    var res = mergeLine(items, function (v) { return v; });
    var out = [], gained = 0;
    res.forEach(function (r) { out.push(r.value); if (r.other !== null) gained += r.value; });
    while (out.length < line.length) out.push(0);
    return { line: out, gained: gained };
  }
  // dir: 0 up, 1 right, 2 down, 3 left. Returns [r,c] cells ordered from the target wall.
  function lineCells(dir, i) {
    var cells = [];
    for (var k = 0; k < SIZE; k++) {
      if (dir === 3) cells.push([i, k]);
      else if (dir === 1) cells.push([i, SIZE - 1 - k]);
      else if (dir === 0) cells.push([k, i]);
      else cells.push([SIZE - 1 - k, i]);
    }
    return cells;
  }
  function moveValues(grid, dir) {
    var out = [], gained = 0, moved = false, r, c;
    for (r = 0; r < SIZE; r++) out.push([0, 0, 0, 0]);
    for (var i = 0; i < SIZE; i++) {
      var cells = lineCells(dir, i);
      var line = cells.map(function (rc) { return grid[rc[0]][rc[1]]; });
      var res = slideLine(line);
      gained += res.gained;
      cells.forEach(function (rc, k) {
        out[rc[0]][rc[1]] = res.line[k];
        if (res.line[k] !== line[k]) moved = true;
      });
    }
    return { grid: out, gained: gained, moved: moved };
  }
  function canMoveValues(g) {
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
      var v = g[r][c];
      if (!v) return true;
      if (c + 1 < SIZE && g[r][c + 1] === v) return true;
      if (r + 1 < SIZE && g[r + 1][c] === v) return true;
    }
    return false;
  }

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = { mergeLine: mergeLine, slideLine: slideLine, moveValues: moveValues, canMoveValues: canMoveValues, lineCells: lineCells };
  }
  if (typeof document === 'undefined') return;

  /* ---------- i18n ---------- */
  var STR = {
    zh: {
      title: '2048 · wyz.name 小游戏', score: '分数', best: '最高', newGame: '新游戏', undo: '撤销',
      sub: '合并方块，挑战 2048！', win: '你赢了！', winMsg: '成功合成 2048，得分 ', keepGoing: '继续游戏',
      over: '游戏结束', overMsg: '本局得分 ', restart: '再来一局',
      help: '<kbd>方向键</kbd> / <kbd>WASD</kbd> 或在棋盘上滑动移动方块，相同数字相撞即合并 · <kbd>Z</kbd> 撤销 · <kbd>N</kbd> 新游戏',
      footer: 'wyz.name 小游戏', lang: 'EN'
    },
    en: {
      title: '2048 · wyz.name Mini Games', score: 'Score', best: 'Best', newGame: 'New Game', undo: 'Undo',
      sub: 'Join the tiles, reach 2048!', win: 'You win!', winMsg: 'You made 2048 with a score of ', keepGoing: 'Keep going',
      over: 'Game over', overMsg: 'Final score ', restart: 'Restart',
      help: '<kbd>Arrows</kbd> / <kbd>WASD</kbd> or swipe the board. Matching tiles merge · <kbd>Z</kbd> undo · <kbd>N</kbd> new game',
      footer: 'wyz.name Mini Games', lang: '中文'
    }
  };
  function detectLang() {
    var p = null;
    try { p = new URLSearchParams(location.search).get('lang'); } catch (e) {}
    if (p) return /^en/i.test(p) ? 'en' : 'zh';
    var nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
    return nav.indexOf('en') === 0 ? 'en' : 'zh';
  }
  var lang = detectLang();
  function t(k) { return STR[lang][k]; }

  /* ---------- storage ---------- */
  var BEST_KEY = 'wyz-games-2048-best', STATE_KEY = 'wyz-games-2048-state';
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- state ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var boardEl = $('board'), tilesEl = $('tiles'), cellsEl = $('cells'), overlay = $('overlay');
  var grid = [], score = 0, best = parseInt(lsGet(BEST_KEY), 10) || 0;
  var won = false, keepGoing = false, over = false;
  var nextId = 1, els = {}, ghosts = [], pendingTimer = null, undoSnap = null, overlayTimer = null;

  function emptyGrid() { var g = []; for (var r = 0; r < SIZE; r++) g.push([null, null, null, null]); return g; }
  function newTile(v, r, c) { return { id: nextId++, v: v, r: r, c: c, isNew: false, merged: false }; }
  function values() { return grid.map(function (row) { return row.map(function (tl) { return tl ? tl.v : 0; }); }); }
  function pos(i) { return 2.5 + i * 24.375; }

  function snapshot() { return { grid: values(), score: score, won: won, keepGoing: keepGoing, over: over }; }

  function spawn() {
    var empty = [];
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) if (!grid[r][c]) empty.push([r, c]);
    if (!empty.length) return;
    var rc = empty[Math.floor(Math.random() * empty.length)];
    var tl = newTile(Math.random() < 0.9 ? 2 : 4, rc[0], rc[1]);
    tl.isNew = true;
    grid[rc[0]][rc[1]] = tl;
  }

  function clearTiles() {
    if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
    ghosts = []; els = {};
    tilesEl.innerHTML = '';
  }
  function flush() {
    if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
    ghosts.forEach(function (g) { var el = els[g.id]; if (el && el.parentNode) el.parentNode.removeChild(el); delete els[g.id]; });
    ghosts = [];
  }

  function tileClass(tl) {
    var color = tl.v > 2048 ? 'vbig' : 'v' + tl.v;
    var cls = 'tile ' + color + ' d' + String(tl.v).length;
    if (tl.ghost) cls += ' ghost';
    if (tl.isNew) cls += ' new';
    if (tl.merged) cls += ' merged';
    return cls;
  }
  function place(tl) {
    var el = els[tl.id];
    if (!el) {
      el = document.createElement('div');
      els[tl.id] = el;
      el.style.left = pos(tl.c) + '%';
      el.style.top = pos(tl.r) + '%';
      tilesEl.appendChild(el);
    }
    el.className = tileClass(tl);
    el.textContent = tl.v;
    el.style.left = pos(tl.c) + '%';
    el.style.top = pos(tl.r) + '%';
  }
  function render() {
    ghosts.forEach(place);
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
      var tl = grid[r][c];
      if (tl) { place(tl); tl.isNew = false; tl.merged = false; }
    }
    if (ghosts.length) {
      pendingTimer = setTimeout(function () { pendingTimer = null; flush(); }, 130);
    }
    updateScore();
    $('undoBtn').disabled = !undoSnap;
  }

  function updateScore(gained) {
    $('score').textContent = score;
    $('best').textContent = best;
    if (gained) {
      var p = document.createElement('div');
      p.className = 'plus'; p.textContent = '+' + gained;
      $('scoreBox').appendChild(p);
      setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 750);
    }
  }

  function save() {
    lsSet(STATE_KEY, JSON.stringify({ grid: values(), score: score, won: won, keepGoing: keepGoing, over: over }));
    lsSet(BEST_KEY, String(best));
  }

  function loadFrom(s) {
    clearTiles();
    grid = emptyGrid();
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) {
      var v = s.grid[r][c];
      if (v) grid[r][c] = newTile(v, r, c);
    }
    score = s.score || 0; won = !!s.won; keepGoing = !!s.keepGoing; over = !!s.over;
    if (score > best) best = score;
  }
  function validState(s) {
    if (!s || !Array.isArray(s.grid) || s.grid.length !== SIZE) return false;
    for (var r = 0; r < SIZE; r++) {
      if (!Array.isArray(s.grid[r]) || s.grid[r].length !== SIZE) return false;
      for (var c = 0; c < SIZE; c++) {
        var v = s.grid[r][c];
        if (typeof v !== 'number' || (v !== 0 && (v < 2 || (v & (v - 1)) !== 0))) return false;
      }
    }
    return s.grid.some(function (row) { return row.some(function (v) { return v; }); });
  }

  function newGame() {
    clearTiles();
    hideOverlay();
    grid = emptyGrid(); score = 0; won = false; keepGoing = false; over = false; undoSnap = null;
    spawn(); spawn();
    render(); save();
  }

  function move(dir) {
    if (overlay.classList.contains('show')) return;
    flush();
    var snap = snapshot();
    var next = emptyGrid(), moved = false, gained = 0, hit2048 = false;
    for (var i = 0; i < SIZE; i++) {
      var cells = lineCells(dir, i);
      var items = [];
      cells.forEach(function (rc) { var tl = grid[rc[0]][rc[1]]; if (tl) items.push(tl); });
      var res = mergeLine(items, function (tl) { return tl.v; });
      res.forEach(function (m, k) {
        var r = cells[k][0], c = cells[k][1];
        if (m.other) {
          [m.item, m.other].forEach(function (g) { g.r = r; g.c = c; g.ghost = true; ghosts.push(g); });
          var nt = newTile(m.value, r, c);
          nt.merged = true;
          next[r][c] = nt;
          gained += m.value; moved = true;
          if (m.value === 2048) hit2048 = true;
        } else {
          if (m.item.r !== r || m.item.c !== c) moved = true;
          m.item.r = r; m.item.c = c;
          next[r][c] = m.item;
        }
      });
    }
    if (!moved) { ghosts = []; return; }
    undoSnap = snap;
    grid = next;
    score += gained;
    if (score > best) best = score;
    spawn();
    render();
    if (gained) updateScore(gained);
    if (hit2048 && !won) {
      won = true;
      showOverlayLater('win', 320);
    } else if (!canMoveValues(values())) {
      over = true;
      showOverlayLater('over', 420);
    }
    save();
  }

  function undo() {
    if (!undoSnap) return;
    loadFrom(undoSnap);
    undoSnap = null;
    hideOverlay();
    render(); save();
  }

  /* ---------- overlay ---------- */
  var overlayKind = null;
  function showOverlayLater(kind, ms) {
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(function () { showOverlay(kind); }, ms);
  }
  function mkBtn(label, primary, fn) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = label;
    if (primary) b.className = 'primary';
    b.addEventListener('click', function (e) { e.stopPropagation(); fn(); });
    return b;
  }
  function showOverlay(kind) {
    overlayKind = kind;
    var btns = $('ovBtns');
    btns.innerHTML = '';
    overlay.classList.remove('win', 'lose');
    if (kind === 'win') {
      overlay.classList.add('win');
      $('ovTitle').textContent = t('win');
      $('ovMsg').innerHTML = t('winMsg') + '<b>' + score + '</b>';
      btns.appendChild(mkBtn(t('keepGoing'), true, function () { keepGoing = true; hideOverlay(); save(); }));
      btns.appendChild(mkBtn(t('newGame'), false, newGame));
    } else {
      overlay.classList.add('lose');
      $('ovTitle').textContent = t('over');
      $('ovMsg').innerHTML = t('overMsg') + '<b>' + score + '</b>';
      btns.appendChild(mkBtn(t('restart'), true, newGame));
      if (undoSnap) btns.appendChild(mkBtn(t('undo'), false, undo));
    }
    overlay.classList.add('show');
  }
  function hideOverlay() {
    clearTimeout(overlayTimer);
    overlayKind = null;
    overlay.classList.remove('show');
  }

  /* ---------- i18n apply ---------- */
  function applyLang() {
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    document.title = t('title');
    var nodes = document.querySelectorAll('[data-i]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute('data-i'));
    $('help').innerHTML = t('help');
    $('langBtn').textContent = t('lang');
    if (overlayKind) showOverlay(overlayKind);
  }

  /* ---------- input ---------- */
  var KEYS = {
    ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3,
    w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3
  };
  window.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key in KEYS) { e.preventDefault(); move(KEYS[e.key]); return; }
    if (e.key === 'z' || e.key === 'Z' || e.key === 'u' || e.key === 'U') { e.preventDefault(); undo(); return; }
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); newGame(); return; }
    if (e.key === 'Enter' && overlayKind) {
      e.preventDefault();
      if (overlayKind === 'win') { keepGoing = true; hideOverlay(); save(); } else newGame();
    }
  });

  var start = null;
  function begin(x, y, id) { start = { x: x, y: y, id: id }; }
  function end(x, y) {
    if (!start) return;
    var dx = x - start.x, dy = y - start.y;
    start = null;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 22) return;
    if (ax > ay) move(dx > 0 ? 1 : 3); else move(dy > 0 ? 2 : 0);
  }
  if (window.PointerEvent) {
    boardEl.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest && e.target.closest('button')) return;
      begin(e.clientX, e.clientY, e.pointerId);
      try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
    });
    boardEl.addEventListener('pointerup', function (e) {
      if (start && start.id === e.pointerId) end(e.clientX, e.clientY);
    });
    boardEl.addEventListener('pointercancel', function () { start = null; });
  } else {
    boardEl.addEventListener('touchstart', function (e) {
      if (e.target.closest && e.target.closest('button')) return;
      var p = e.touches[0]; begin(p.clientX, p.clientY, 'touch');
    }, { passive: true });
    boardEl.addEventListener('touchend', function (e) {
      var p = e.changedTouches[0]; end(p.clientX, p.clientY);
    });
  }
  // Keep the page from scrolling / zooming.
  document.addEventListener('touchmove', function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouchEnd < 320 && !(e.target.closest && e.target.closest('button')) && e.cancelable) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  $('newBtn').addEventListener('click', function () { newGame(); this.blur(); });
  $('undoBtn').addEventListener('click', function () { undo(); this.blur(); });
  $('langBtn').addEventListener('click', function () {
    lang = lang === 'en' ? 'zh' : 'en';
    try {
      var u = new URL(location.href); u.searchParams.set('lang', lang);
      history.replaceState(null, '', u.toString());
    } catch (e) {}
    applyLang(); this.blur();
  });

  /* ---------- init ---------- */
  (function buildCells() {
    var html = '';
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++)
      html += '<div class="cell" style="left:' + pos(c) + '%;top:' + pos(r) + '%"></div>';
    cellsEl.innerHTML = html;
  })();
  applyLang();
  var saved = null;
  try { saved = JSON.parse(lsGet(STATE_KEY)); } catch (e) { saved = null; }
  if (validState(saved)) {
    loadFrom(saved);
    render();
    if (won && !keepGoing) showOverlay('win');
    else if (over || !canMoveValues(values())) { over = true; showOverlay('over'); }
  } else {
    newGame();
  }
})();
</script>
</body>
</html>
